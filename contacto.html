<body> 

        <header>
        <div class="logo">
            <h1>NutriVida</h1>
        </div>

        <div class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nav-container" id="navContainer">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>

            <div class="header-actions">
                <a href="login.html" class="auth-link">Iniciar sesión</a> | 
                <a href="registro.html" class="auth-link">Registrar usuario</a>
            </div>
        </div>
    </header>

    <main class="container contacto-container">
        
        <section class="map-section">
            <h2>Nuestra Ubicación</h2>
            <div class="map-wrapper">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d100030.01018698144!2d-72.67568522306232!3d-38.73449303358053!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9614d3e5ebcb7729%3A0xe54d193d489b14fc!2sTemuco%2C%20Araucania!5e0!3m2!1sen!2scl!4v1700000000000!5m2!1sen!2scl" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>

        <section class="auth-card contacto-card">
            <h2>Envíanos un Mensaje</h2>
            <form id="contactoForm" novalidate>
                <div class="form-group">
                    <label for="contactoNombre">Nombre Completo:</label>
                    <input type="text" id="contactoNombre" name="nombre" maxlength="100" placeholder="Ej. Juan Pérez" required>
                    <span class="error-message" id="contactoNombreError"></span>
                </div>

                <div class="form-group">
                    <label for="contactoEmail">Correo Electrónico:</label>
                    <input type="email" id="contactoEmail" name="email" maxlength="100" placeholder="ejemplo@gmail.com">
                    <span class="error-message" id="contactoEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="contactoMensaje">Comentario:</label>
                    <textarea id="contactoMensaje" name="mensaje" maxlength="500" placeholder="Escribe tu consulta aquí..." rows="5" required></textarea>
                    <span class="error-message" id="contactoMensajeError"></span>
                </div>

                <button type="submit" class="btn-primary">Enviar Mensaje</button>
            </form>
        </section>

    </main>

    <footer class="main-footer">
        <div class="footer-info">
            <p>📍 Ubicación: <a href="https://www.google.com/maps/search/?api=1&query=Temuco,+Región+de+La+Araucanía" target="_blank" rel="noopener noreferrer" class="map-link">Temuco, Región de La Araucanía</a></p>
            <p>📧 Correo: contacto@nutrivida.cl</p>
        </div>
        <div class="footer-copyright">
            <p>&copy; 2026 NutriVida - Clínica Nutricional. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
