<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="assets/CSS/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>NutriVida</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html" class="active">Iniciar Sesión</a></li>    
            </ul>
        </nav>
    </header>
    <main class="container">
        <section class="auth-card">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" maxlength="100" placeholder="ejemplo@gmail.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" minlength="4" maxlength="10" placeholder="entre 4 y 10 caracteres" required>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
            <p class="auth-redirect">¿No tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 NutriVida - Clínica y Tienda Nutricional. Todos los derechos reservados.</p>
    </footer>

    <script src="assets/JS/validation.js"></script>

</body>

</html>
