name: Pruebas y GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pruebas:
    name: Pruebas E2E NutriVida
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # - name: Pruebas unitarias y de componentes (Vitest)
      #   run: npm run test:run
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas end-to-end (Playwright)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build-pages:
    if: github.ref == 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar el proyecto (Vite)
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-pages
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4